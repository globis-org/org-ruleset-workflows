name: Secrets Scan with Trivy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.actor, '[bot]') }} # [bot]を含む場合は除外する
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref }}

    - name: Run Aqua Security Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: . # default
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL # default
        scanners: secret
        output: trivy.txt
        exit-code: 1

    - name: Post PR comments
      if: failure()
      env:
        GITHUB_TOKEN: ${{ github.token }}
        URL: ${{ github.event.pull_request.html_url }}
      run: |
        {
          echo ':warning: **シークレットが検出されました**'
          echo ''
          echo 'このPRの変更内容にシークレット（APIキー、パスワード、トークンなど）が含まれている可能性があります。'
          echo ''
          echo '**対処方法:**'
          echo '- 該当のシークレットをコードから削除し、環境変数やシークレットマネージャーを使用してください'
          echo '- 既にコミット履歴に含まれている場合は、シークレットのローテーション（無効化と再発行）を行ってください'
          echo '- 詳細は [Notion](https://www.notion.so/globisorg/GitHub-dcb884f8df2646df8d8e686bd6290d46) を参照してください'
          echo ''
          echo '<details><summary>検出結果</summary>'
          echo ''
          echo '```'
          cat trivy.txt
          echo '```'
          echo ''
          echo '</details>'
          echo ''
          echo '---'
          echo 'このチェックは[セキュリティチーム](https://globis.slack.com/archives/C013MAHJUCB)が運営しています。'
        } > comment.md
        gh pr comment -F ./comment.md "${URL}"
